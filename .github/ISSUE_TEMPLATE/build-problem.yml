name: Build problem
description: The build script, schema validation, or tests fail.
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: Command and full error output
      render: text
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What you changed in config/
      description: Use fictional values in place of anything confidential.
  - type: input
    id: python
    attributes:
      label: Python version and operating system
    validations:
      required: true
