# Intake sections, in the order they appear in the output.
# Rename, reorder, disable, or add sections to match your intake form.
#
# Fields
#   id        stable key, lowercase-with-dashes
#   label     heading shown in the output
#   guidance  what belongs in the section
#   example   a short sample entry that shows the expected detail (optional)
#   required  true marks the section [MISSING] when empty and counts it as a gap
#   enabled   false hides the section without deleting it

sections:
  - id: request-summary
    label: Request summary
    guidance: Two or three sentences. What is changing, for whom, and by when.
    example: Add a delivery window field to the online order form for all store regions by June 1.
    required: true
    enabled: true

  - id: business-need
    label: Business need
    guidance: The problem or opportunity behind the request, in business terms. Not the proposed fix.
    example: Staff spend about 20 hours a week calling people to confirm details the form does not collect.
    required: true
    enabled: true

  - id: desired-outcome
    label: Desired outcome and success measure
    guidance: What will be true after release, and how anyone will know. Include a number or observable result when the source gives one.
    example: Follow-up calls drop by half within two months of release.
    required: true
    enabled: true

  - id: source-summary
    label: Summary of source communications
    guidance: The key points from each attached email or note, with sender and date.
    example: Email from the program manager, May 2, asks for the change before the new fiscal year.
    required: true
    enabled: true

  - id: in-scope
    label: In scope
    guidance: Each item that will change. One line per item.
    example: New required field on the request form.
    required: true
    enabled: true

  - id: out-of-scope
    label: Out of scope
    guidance: Items stated or implied as excluded. Mark [MISSING] if the source never draws a boundary.
    example: The mobile app, which changes in a later release.
    required: true
    enabled: true

  - id: products-and-data
    label: Products, services, files, and data elements
    guidance: Named products or services, request or case types, files, reports, and data fields involved.
    example: Weekly orders extract, fields order_id, ship_date, and region_code.
    required: true
    enabled: true

  - id: external-parties
    label: External parties and contacts
    guidance: Each outside organization involved, its role, and the named contact.
    example: The payment vendor, which hosts the checkout page. Contact is its account manager.
    required: false
    enabled: true

  - id: impacted-systems
    label: Impacted systems and applications
    guidance: Every platform, application, job, feed, or report that changes or reads changed data.
    example: Online request portal (changes), nightly export job (reads changed data).
    required: true
    enabled: true

  - id: impacted-teams
    label: Impacted teams and stakeholders
    guidance: Teams that build, test, approve, support, or use the change.
    example: Web team builds it, support team uses it, compliance team approves it.
    required: true
    enabled: true

  - id: testing
    label: Testing
    guidance: >-
      Internal testing and external testing as separate lists. For each: test
      types, named testers or teams, environments, test data or test users,
      and key scenarios.
    example: Internal regression testing by the QA team in the test environment. No external testing.
    required: true
    enabled: true

  - id: dates
    label: Dates and milestones
    guidance: Target implementation date, testing window, and any external deadline with its reason.
    example: Testing May 4 to May 15. Live by June 1, when the new policy takes effect.
    required: true
    enabled: true

  - id: dependencies
    label: Dependencies
    guidance: Work, approvals, or deliveries this request needs from others, each with an owner.
    example: Vendor delivers a test environment by April 20. Owner is the vendor account manager.
    required: true
    enabled: true

  - id: assumptions
    label: Assumptions
    guidance: Statements the plan relies on that nobody has confirmed yet.
    example: The current form system supports a new required field without an upgrade.
    required: false
    enabled: true

  - id: risks
    label: Risks and blockers
    guidance: Known issues that could delay or derail the work, with who raised them.
    example: The vendor release calendar may not have a slot before June. Raised by the web team lead.
    required: true
    enabled: true
