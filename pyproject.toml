[project]
name = "requirements-intake-agent"
version = "1.0.0"
description = "Configurable agent instructions for turning rough project requests into a complete intake."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yonatan Tsige" }]
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
